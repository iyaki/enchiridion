version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: fast
  enable:
    - errcheck
    - revive
    - forbidigo
  disable:
    - depguard
    - wsl
    # White-box tests construct clients with unexported fields (httptest).
    - testpackage
  exclusions:
    rules:
      # internal/sync names the sync engine (specs/architecture.md); the
      # stdlib name collision is harmless — the package never imports stdlib
      # sync.
      - path: internal/sync/
        text: "avoid package names that conflict"
        linters:
          - revive
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        # All HTTP traffic must flow through internal/notion (ADR-08: auditable chain).
        - pattern: '^http\.(Get|Head|Post|PostForm)\('
        - pattern: 'http\.DefaultClient'

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
