version: 3
workdir: .
allow:
  ignoreNotFoundComponents: true

components:
  cmd:
    in:
      - cmd/**
  cli:
    in:
      - internal/cli/**
  notion:
    in:
      - internal/notion/**
  render:
    in:
      - internal/render/**
  sync:
    in:
      - internal/sync/**

deps:
  cmd:
    anyProjectDeps: true
  cli:
    anyProjectDeps: true
  sync:
    mayDependOn:
      - notion
      - render
    anyVendorDeps: false
  # notion and render are intentionally absent from deps: with no rule and no
  # commonComponents, they cannot depend on any other component (ADR-08).
