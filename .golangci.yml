version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: fast
  enable:
    - errcheck
    - revive
    - forbidigo
  disable:
    - depguard
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        # All HTTP traffic must flow through internal/notion (ADR-08: auditable chain).
        - pattern: '^http\.(Get|Head|Post|PostForm)\('
        - pattern: 'http\.DefaultClient'

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
