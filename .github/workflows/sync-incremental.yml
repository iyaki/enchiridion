name: sync-incremental

on:
  schedule:
    - cron: "30 3 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the monthly full sync: concurrent runs would race the data/
# swap (specs/architecture.md — exclusivity).
concurrency:
  group: enchiridion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "~1.25.8"

      - name: Build
        run: go build -o enchiridion ./cmd/enchiridion

      # First run has no committed mirror: the engine auto-backfills (full).
      - name: Sync
        run: ./enchiridion sync | tee "$GITHUB_STEP_SUMMARY"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          KNOWLEDGE_BASE_DATASOURCE_ID: ${{ secrets.KNOWLEDGE_BASE_DATASOURCE_ID }}
          ENCHIRIDION_HOME: data

      # A mirror containing a secret is never switched (specs/integration.md).
      - name: Scan mirror for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --no-git --source data --config .gitleaks.toml --redact -v

      - name: Commit and push mirror
        run: |
          git config user.name "enchiridion-bot"
          git config user.email "enchiridion-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Mirror unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "sync: incremental $(date -u +%F)"
          git push
