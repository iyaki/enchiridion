name: Sync knowledge base

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node index.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          KNOWLEDGE_BASE_DATASOURCE_ID: ${{ secrets.KNOWLEDGE_BASE_DATASOURCE_ID }}
      - name: Commit mirrored knowledge
        run: |
          git config user.name "enchiridion-bot"
          git config user.email "bot@iyaki.ar"
          git add knowledge/
          git diff --cached --quiet || git commit -m "sync: update knowledge base"
          git push
