# Config for the sync workflows' mirror scan (specs/integration.md —
# Secrets in the mirror). Default rules plus an allowlist for KB articles
# that QUOTE key formats as content: they are documentation, not
# credentials. A real secret appearing anywhere else still fails the scan
# and the mirror is never switched.

[extend]
useDefault = true

[allowlist]
description = "Example keys quoted inside KB articles"
paths = [
  '''capo-js-get-your-head-in-order--7346d7ec\.md$''',
  '''humanlayer-12-factor-agents-.*--39054f1c\.md$''',
  '''jgthms-picknplace-js-.*--2d154f1c\.md$''',
  '''steffest-dpaint-js-.*--2f554f1c\.md$''',
  '''vert-sh-vert-.*--2cc54f1c\.md$''',
  '''a-technical-deep-dive-on-event-driven-architectures--65a181ca\.md$''',
  '''rules-for-writing-software-tutorials-refactoring-english--17454f1c\.md$''',
  '''you-can-spot-base64-encoded-json-certificates-and-private-keys--2b754f1c\.md$''',
  '''your-api-shouldn-t-redirect-http-to-https--9ee9dc6a\.md$''',
  '''fatedier-frp-.*--20054f1c\.md$''',
  '''gitleaks-protect-and-discover-secrets--6a4c0769\.md$''',
  '''keygraphhq-shannon-.*--31c54f1c\.md$''',
]
regexes = [
  # Dropbox share-link keys embedded in clipped URLs: published link tokens
  # that grant the same access as the link itself, not credentials.
  '''rlkey=[A-Za-z0-9_-]+''',
]
